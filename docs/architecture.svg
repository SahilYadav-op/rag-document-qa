<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 380" width="890" height="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2a37"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="6" y="4" width="14" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/><text x="26" y="15.5" text-anchor="start" font-size="11" fill="#64748b" font-weight="normal"><tspan x="26" dy="0">you</tspan></text><rect x="62.3" y="4" width="14" height="14" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/><text x="82.3" y="15.5" text-anchor="start" font-size="11" fill="#64748b" font-weight="normal"><tspan x="82.3" dy="0">this app&#x27;s code</tspan></text><rect x="191.8" y="4" width="14" height="14" rx="3" fill="#e8e9ff" stroke="#4f46e5" stroke-width="1.3"/><text x="211.8" y="15.5" text-anchor="start" font-size="11" fill="#64748b" font-weight="normal"><tspan x="211.8" dy="0">Cohere model</tspan></text><rect x="303.0" y="4" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.3"/><text x="323.0" y="15.5" text-anchor="start" font-size="11" fill="#64748b" font-weight="normal"><tspan x="323.0" dy="0">Pinecone</tspan></text><text x="6" y="46" text-anchor="start" font-size="12.5" fill="#3730a3" font-weight="600"><tspan x="6" dy="0">A.  INDEXING  (once per document)</tspan></text><rect x="6" y="58" width="156" height="84" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="84.0" y="87.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="84.0" dy="0">PDF</tspan></text><text x="84.0" y="104.42" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="84.0" dy="0">uploaded or the</tspan></text><text x="84.0" y="121.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="84.0" dy="0">sample</tspan></text><path d="M162,100.0 L188,100.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="188" y="58" width="156" height="84" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="266.0" y="87.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="266.0" dy="0">Read pages</tspan></text><text x="266.0" y="104.42" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="266.0" dy="0">PyMuPDF text blocks</tspan></text><text x="266.0" y="121.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="266.0" dy="0">one entry per page</tspan></text><path d="M344,100.0 L370,100.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="370" y="58" width="156" height="84" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="448.0" y="87.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="448.0" dy="0">Chunk</tspan></text><text x="448.0" y="104.42" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="448.0" dy="0">about 1,000 characters,</tspan></text><text x="448.0" y="121.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="448.0" dy="0">150 overlap, page numbers</tspan></text><path d="M526,100.0 L552,100.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="552" y="58" width="156" height="84" rx="9" fill="#e8e9ff" stroke="#4f46e5" stroke-width="1.5"/><text x="630.0" y="87.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="630.0" dy="0">Embed</tspan></text><text x="630.0" y="104.42" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="630.0" dy="0">embed-english-v3.0</tspan></text><text x="630.0" y="121.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="630.0" dy="0">1,024 numbers per chunk</tspan></text><path d="M708,100.0 L734,100.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="734" y="58" width="156" height="84" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="812.0" y="87.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="812.0" dy="0">Store</tspan></text><text x="812.0" y="104.42" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="812.0" dy="0">one index, one namespace</tspan></text><text x="812.0" y="121.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="812.0" dy="0">per document</tspan></text><path d="M812,142 L812,176 L368,176 L368,198" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="560" y="170" text-anchor="middle" font-size="10.5" fill="#64748b" font-weight="normal"><tspan x="560" dy="0">the stored chunks are searched here</tspan></text><text x="6" y="192" text-anchor="start" font-size="12.5" fill="#3730a3" font-weight="600"><tspan x="6" dy="0">B.  ANSWERING  (every question)</tspan></text><rect x="6" y="204" width="134" height="84" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="73.0" y="242.1" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="73.0" dy="0">Question</tspan></text><text x="73.0" y="258.74" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="73.0" dy="0">typed in the chat</tspan></text><path d="M140,246.0 L154,246.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="154" y="204" width="134" height="84" rx="9" fill="#e8e9ff" stroke="#4f46e5" stroke-width="1.5"/><text x="221.0" y="233.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="221.0" dy="0">Rewrite</tspan></text><text x="221.0" y="250.42000000000002" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="221.0" dy="0">follow-ups only,</tspan></text><text x="221.0" y="267.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="221.0" dy="0">using the chat so far</tspan></text><path d="M288,246.0 L302,246.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="302" y="204" width="134" height="84" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="369.0" y="233.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="369.0" dy="0">Embed and search</tspan></text><text x="369.0" y="250.42000000000002" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="369.0" dy="0">the 10 nearest chunks,</tspan></text><text x="369.0" y="267.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="369.0" dy="0">cosine similarity</tspan></text><path d="M436,246.0 L450,246.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="450" y="204" width="134" height="84" rx="9" fill="#e8e9ff" stroke="#4f46e5" stroke-width="1.5"/><text x="517.0" y="233.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="517.0" dy="0">Rerank</tspan></text><text x="517.0" y="250.42000000000002" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="517.0" dy="0">keep the best 3</tspan></text><text x="517.0" y="267.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="517.0" dy="0">drop weak matches</tspan></text><path d="M584,246.0 L598,246.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="598" y="204" width="134" height="84" rx="9" fill="#e8e9ff" stroke="#4f46e5" stroke-width="1.5"/><text x="665.0" y="233.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="665.0" dy="0">Answer</tspan></text><text x="665.0" y="250.42000000000002" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="665.0" dy="0">Command R+ from</tspan></text><text x="665.0" y="267.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="665.0" dy="0">those chunks only</tspan></text><path d="M732,246.0 L746,246.0" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="746" y="204" width="134" height="84" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="813.0" y="233.78" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="813.0" dy="0">Show</tspan></text><text x="813.0" y="250.42000000000002" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="813.0" dy="0">answer, pages,</tspan></text><text x="813.0" y="267.06" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="813.0" dy="0">and the sources</tspan></text><rect x="6" y="316" width="878" height="52" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="445.0" y="338.1" text-anchor="middle" font-size="13" fill="#1f2a37" font-weight="600"><tspan x="445.0" dy="0">Guards</tspan></text><text x="445.0" y="354.74" text-anchor="middle" font-size="12" fill="#374151" font-weight="normal"><tspan x="445.0" dy="0">keys stay in the browser session  ·  page and chunk limits  ·  links and images in answers shown as plain text  ·  old namespaces removed after 24 hours</tspan></text></svg>